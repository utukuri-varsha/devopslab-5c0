<!DOCTYPE html>
<html>
<head>
    <title>Registration Form</title>
</head>
<body>

<h2>Registration Form</h2>

<form>
    Name: <input type="text" placeholder="Enter your name"><br><br>

    Email: <input type="email" placeholder="Enter your email"><br><br>

    Password: <input type="password" placeholder="Enter password"><br><br>

    Phone: <input type="tel" placeholder="Enter phone number"><br><br>

    Gender:
    <input type="radio" name="gender"> Male
    <input type="radio" name="gender"> Female<br><br>

    <input type="submit" value="Register">
    <input type="reset" value="Clear">
</form>

</body>
</html>
